<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0f1115; color: #e8e8e8; text-align: center; padding: 16px; box-sizing: border-box; }
    p { color: #9aa0a6; max-width: 32rem; }
    #orb { width: 110px; height: 110px; margin: 24px auto; border-radius: 50%; border: 2px solid #333; transition: all .3s; }
    #orb.waiting { border-color: #2a6f8f; }
    #orb.talking { border-color: #39c0ff; background: #39c0ff33; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    button { font: inherit; padding: 12px 20px; margin: 4px; border: 1px solid #39c0ff; background: none; color: #39c0ff; cursor: pointer; }
    #err { color: #ff6b6b; }
  </style>
</head>
<body>
  <main>
    <h1>Jarvis</h1>
    <p>Activalo una vez y dejá la página abierta. Cada vez que digas “Jarvis” te atiende.</p>
    <div id="orb"></div>
    <p id="status">Apagado</p>
    <p id="err"></p>
    <button id="on">Activar Jarvis</button>
    <button id="now" hidden>Hablar ahora</button>
    <button id="hang" hidden>Colgar</button>
  </main>

  <script type="module">
    import { Conversation } from 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1/+esm';

    const AGENT_ID = 'agent_9901m40zk8avfdfbaj1h5xehnta2';
    const WAKE = /\b(j|y|ll|ch|h|sh|g)?arv[ie]s?\b|\bjarvi\b|\bjervis\b/;
    const $ = (id) => document.getElementById(id);
    let state = 'off', rec = null, session = null;

    function set(s, text) {
      state = s;
      $('orb').className = s;
      $('status').textContent = text;
      $('on').hidden = s !== 'off';
      $('now').hidden = s !== 'waiting';
      $('hang').hidden = s !== 'talking';
    }
    const norm = (t) => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ\s]/g, ' ');
    const listen = () => { try { rec.start(); } catch {} };

    async function enable() {
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Ctor) { $('err').textContent = 'Este navegador no soporta reconocimiento de voz. Usá Chrome o Edge.'; return; }
      try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop()); }
      catch { $('err').textContent = 'Sin permiso para el micrófono.'; return; }
      rec = new Ctor();
      rec.lang = 'es-AR'; rec.continuous = true; rec.interimResults = true;
      rec.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++)
          if (WAKE.test(norm(e.results[i][0].transcript))) return wake();
      };
      rec.onend = () => { if (state === 'waiting') setTimeout(listen, 250); };
      try { await navigator.wakeLock?.request('screen'); } catch {}
      $('err').textContent = '';
      set('waiting', 'Esperando "Jarvis"…');
      listen();
    }

    async function wake() {
      if (state !== 'waiting') return;
      set('connecting', 'Conectando…');
      rec.abort();
      try {
        session = await Conversation.startSession({
          agentId: AGENT_ID,
          connectionType: 'webrtc',
          onConnect: () => set('talking', 'Te escucho'),
          onModeChange: ({ mode }) => set('talking', mode === 'speaking' ? 'Jarvis está hablando' : 'Te escucho'),
          onDisconnect: () => { session = null; set('waiting', 'Esperando "Jarvis"…'); listen(); },
        });
      } catch (err) {
        $('err').textContent = 'No se pudo conectar: ' + (err?.message || err);
        set('waiting', 'Esperando "Jarvis"…'); listen();
      }
    }

    $('on').onclick = enable;
    $('now').onclick = wake;
    $('hang').onclick = () => session?.endSession();
  </script>
</body>
</html>
